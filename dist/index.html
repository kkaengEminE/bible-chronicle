:root{--ink:#203e38;--green:#244d42;--paper:#f6f4ec;--muted:#758078;--line:#dedfd4;--gold:#bc8c42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 16px;background:#fff}button:hover{border-color:#7c9b83;background:#edf1e7}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b58a45;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:35px;letter-spacing:-1.5px;line-height:1.3}h2{font-size:23px;letter-spacing:-.6px}h3{font-size:17px}small,.muted{color:var(--muted)}.shell{max-width:1320px;margin:auto;display:grid;grid-template-columns:225px 1fr;min-height:100vh}.sidebar{padding:34px 24px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:46px}.brand small{font-size:10px;letter-spacing:2px}.mark{display:inline-grid;place-items:center;width:33px;height:33px;background:var(--green);color:#ead7a2;border-radius:10px;margin-right:7px}.nav{display:grid;gap:9px}.nav button{text-align:left;background:transparent;border-color:transparent}.nav button.active{background:#e2e8da;color:#254b35;font-weight:700}.nav b{margin-right:12px}.sidefoot{margin-top:auto;font-size:12px}.main{padding:28px 44px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:34px}.tag{font-size:11px;letter-spacing:1px;color:var(--gold);font-weight:800}.pill{background:#e9ecdf;border:1px solid #d8deca;padding:5px 12px;border-radius:30px;font-size:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,1fr);gap:24px}.panel{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:22px}.hero{background:var(--green);color:#fff8e9;position:relative;overflow:hidden;min-height:260px;padding:29px;border-radius:18px;margin-bottom:22px}.hero p{color:#c7d6c9;max-width:290px}.hero .tag{color:#dbbf79}.hero h2{font-size:30px;margin:14px 0 8px}.primary{background:var(--green);color:white;border:0;font-weight:700}.primary:hover{background:#32624f;color:white}.hero button{background:#ecdbaf;border:0;color:#243d30}.hero .art{position:absolute;right:-20px;bottom:-35px;width:240px;opacity:.3;pointer-events:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.stat{border-left:1px solid var(--line);padding-left:17px}.stat:first-child{border:0;padding-left:0}.stat strong{display:block;font-size:25px}.progress{height:8px;background:#e8eadd;border-radius:10px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#789362;border-radius:10px}.chapters{display:flex;gap:10px;margin-top:24px}.chapter{flex:1;text-align:center;padding:13px 4px;background:#f0f0e7;border-radius:12px;font-size:12px}.chapter.current{background:#e5eada;border:1px solid #8eaa75}.chapter strong{display:block;font-size:18px}.card{max-width:260px;min-height:330px;margin:18px auto;background:#20463d;color:#f3e6bf;border:5px double #c4a45f;border-radius:17px;padding:20px;text-align:center;box-shadow:0 12px 20px #16372919;position:relative}.card.gold{background:linear-gradient(145deg,#5d4926,#29483c);border-color:#e5ba52;box-shadow:0 0 24px #bd964e55}.card.locked{filter:saturate(.3);opacity:.78}.card .symbol{font-size:78px;line-height:1.8;font-family:Georgia,serif}.card h2{font-size:28px;color:#f8edca;margin-bottom:0}.card p{font-size:12px;color:#d4d9bd}.card .tag{color:#e7ca8a}.card .corner{position:absolute;right:12px;top:12px;font-size:12px}.hint{padding:12px 15px;background:#edeede;border-radius:10px;font-size:13px}.week{display:flex;gap:8px;justify-content:space-between;margin:17px 0}.day{border-radius:50%;width:30px;height:30px;background:#eef0e6;text-align:center;line-height:30px;font-size:11px}.day.done{background:#365c44;color:white}.reader{max-width:730px;margin:auto}.verse{display:flex;gap:18px;border:1px solid transparent;padding:14px 10px;border-radius:9px;text-align:left;width:100%;background:transparent;line-height:1.95}.verse span:first-child{font-size:12px;color:#9a874e;min-width:22px}.verse.selected{background:#e9efdf;border-color:#a9b694}.verse.saved:after{content:'★';color:#b58a45}.verse:hover{background:#f0f2e8}.reader-body{font-family:Georgia,'Batang',serif;font-size:17px}.reader-head{position:sticky;top:0;background:var(--paper);padding:15px 0;z-index:2}.actions{position:sticky;bottom:12px;background:#fffefa;box-shadow:0 4px 30px #203e3815;padding:14px;border:1px solid var(--line);border-radius:13px;margin-top:20px}.full{width:100%}input,textarea,select{border:1px solid #d8ded2;border-radius:9px;padding:11px;width:100%;background:#fffefa;color:var(--ink)}label{display:block;font-size:13px;margin-bottom:15px}textarea{min-height:140px}dialog{border:1px solid var(--line);border-radius:20px;padding:30px;max-width:520px;width:calc(100% - 28px);color:var(--ink);background:var(--paper);max-height:90vh;overflow:auto}dialog::backdrop{background:#142e2966;backdrop-filter:blur(4px)}.choices{display:grid;gap:10px;margin:20px 0}.note{border-top:1px solid var(--line);padding:18px 0}.note p{white-space:pre-wrap;overflow-wrap:anywhere}.link{border:0;background:transparent;padding:3px;color:#426a4f;text-decoration:underline;font-size:13px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#213f36;color:white;padding:12px 22px;border-radius:12px;z-index:10;max-width:90vw}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.collection .card{width:100%;min-height:300px}.caption{font-size:12px;color:var(--muted);margin:8px 0 20px}.section-title{margin:28px 0 15px}.note-links{display:flex;gap:8px;flex-wrap:wrap}.note-links button{font-size:12px;padding:4px 8px}.mobile-label{display:none}@media(max-width:1050px){.main{padding:25px}.shell{grid-template-columns:190px 1fr}.sidebar{padding:30px 15px}.grid{grid-template-columns:1fr}.collection{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}.sidebar{height:auto;padding:15px 18px;border-right:0;border-bottom:1px solid var(--line);position:static}.brand{margin:0;font-size:17px}.brand small{font-size:9px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fdfcf5;border-top:1px solid var(--line);z-index:5;padding:7px;gap:3px}.nav button{flex:1;text-align:center;font-size:12px;padding:9px 2px}.nav b{display:block;margin:0}.sidefoot{display:none}.main{padding:20px 18px 95px}.topbar{margin-bottom:22px}h1{font-size:28px}.panel{padding:20px}.hero{padding:24px}.hero .art{width:160px}.hero p{max-width:220px}.collection{grid-template-columns:1fr 1fr;gap:10px}.collection .card{padding:10px;min-height:250px}.card .symbol{font-size:60px}.actions{bottom:78px}.stat strong{font-size:21px}.toast{bottom:85px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">✧</span>바이블 크로니클<br><small>BIBLE CHRONICLE</small></div><nav class="nav" aria-label="주 메뉴"><button data-tab="home"><b>◈</b>나의 1독</button><button data-tab="bible"><b>▤</b>자유 읽기</button><button data-tab="cards"><b>✧</b>카드 도감</button><button data-tab="notes"><b>▧</b>나의 기록</button></nav><div class="sidefoot"><p>첫 번째 항해 · 요나서</p><p>로컬 시제품<br>기록은 이 브라우저에 저장됩니다.</p><button id="reset" class="link">체험 기록 초기화</button><br><a href="../기획서.md">기획서</a></div></aside><main class="main"><div class="topbar"><span>나의 작은 기록이, 한 권의 여정으로.</span><span class="pill">요나서 1장 체험판</span></div><div id="view"></div><footer class="row" style="margin-top:30px"><small>로컬 체험 · 이 브라우저에 저장</small><button class="link" onclick="document.querySelector('#reset').click()">체험 초기화</button><a class="link" href="../기획서.md">기획서 보기</a></footer></main></div><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div><script>
const verses=['하나님이 아밋대의 아들 요나에게 말씀하신다.','큰 도시 니느웨로 가서 그들의 악을 향해 외치라는 사명을 받는다.','요나는 사명을 피해 욥바로 내려가 다시스로 향하는 배에 오른다.','하나님이 바다에 큰 바람을 보내시자 배가 부서질 듯한 폭풍이 인다.','선원들은 두려워하며 각자의 신에게 부르짖고 짐을 버린다. 요나는 배 아래에서 잠들어 있다.','선장은 요나를 깨워 그의 하나님께 도움을 구하라고 한다.','사람들은 재앙의 원인을 알아보려고 제비를 뽑고, 요나가 지목된다.','그들은 요나의 일과 고향, 나라와 민족을 묻는다.','요나는 자신이 히브리 사람이며 바다와 육지를 지으신 하나님을 경외한다고 말한다.','요나가 하나님을 피해 도망 중임을 들은 사람들은 크게 두려워한다.','바다가 더욱 거칠어지자 그들은 어떻게 해야 바다가 잔잔해질지 묻는다.','요나는 자신 때문에 폭풍이 일어났으니 자신을 바다에 던지라고 말한다.','선원들은 육지로 돌아가려고 애써 노를 젓지만 폭풍을 이기지 못한다.','그들은 하나님께 이 일로 자신들에게 죄를 돌리지 말아 달라고 간구한다.','사람들이 요나를 바다에 던지자 사납던 바다가 잠잠해진다.','사람들은 하나님을 크게 두려워하며 제사를 드리고 서원을 한다.','하나님이 큰 물고기를 준비해 요나를 삼키게 하시고, 요나는 그 안에서 사흘 밤낮을 보낸다.'];
const KEY='bible-chronicle-v1';const fresh=()=>({read:false,quiz:false,days:[],bookmarks:[],notes:[],reviewDays:[],gold:false});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}let tab='home',selection=3,mode='plan';let qIndex=0;const view=document.querySelector('#view'),modal=document.querySelector('#modal');const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('저장 공간을 확인해 주세요. 이번 변경은 저장되지 않았습니다.')}}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,3500)}function open(html){modal.innerHTML=html;if(!modal.open)modal.showModal()}function closeModal(){modal.close()}function card(locked=false,gold=false){return `<div class="card ${locked?'locked':''} ${gold?'gold':''}"><span class="corner">${gold?'GOLD':'C'}</span><div class="tag">CHRONICLE NO. 001</div><div class="symbol">⛵</div><h2>요나</h2><p>도망에서 시작된 부르심</p><div class="tag">${locked?'읽기와 복습으로 해금':gold?'황금 테두리 · 복습의 기록':'첫 번째 항해 · 기본판'}</div></div>`}function streak(){let n=0,d=new Date();if(!s.days.includes(today()))d.setDate(d.getDate()-1);while(s.days.includes(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){n++;d.setDate(d.getDate()-1)}return n}function go(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});({home,bible:()=>reader('free'),cards,notes}[t])();window.scrollTo(0,0)}
function home(){view.innerHTML=`<div class="row between"><div><div class="tag">YOUR READING JOURNEY</div><h1>오늘도, 한 장 앞으로.</h1></div><span class="pill">✦ ${s.quiz?30:0} XP</span></div><div class="stats"><div class="stat"><small>성경 전체 1독</small><strong>${s.read?'0.08':'0.00'}<small>%</small></strong><small>${+s.read} / 1,189장</small></div><div class="stat"><small>연속 읽기</small><strong>${streak()}<small>일</small></strong><small>오늘 읽으면 이어집니다</small></div><div class="stat"><small>수집한 인물</small><strong>${+s.quiz}<small> / 1</small></strong><small>요나 체험 도감</small></div></div><div class="grid"><div><section class="hero"><div class="tag">PROLOGUE · 첫 번째 항해</div><h2>${s.read?'한 장을 기록했어요.':'요나의 여정을 시작해요.'}</h2><p>부르심, 도망, 그리고 거친 바다.<br>오늘은 요나서 1장을 만납니다.</p><button onclick="reader('plan')">${s.read?'다시 읽고 복습하기':'오늘의 1장 읽기'}　→</button><svg class="art" viewBox="0 0 200 240" fill="none"><circle cx="100" cy="110" r="88" stroke="#f0d18b"/><circle cx="100" cy="110" r="65" stroke="#f0d18b"/><path d="M100 18L130 142L100 122L70 142Z" fill="#f0d18b"/><path d="M20 180Q60 150 100 180T190 180M10 205Q55 175 100 205T190 205" stroke="#f0d18b" stroke-width="3"/></svg></section><section class="panel"><div class="row between"><h3>요나서 탐험 지도</h3><small>${+s.read} / 4장</small></div><div class="progress"><span style="width:${s.read?25:0}%"></span></div><div class="chapters"><div class="chapter current"><strong>${s.read?'✓':'01'}</strong>폭풍과 도망</div><div class="chapter"><strong>02</strong>물고기 속 기도</div><div class="chapter"><strong>03</strong>니느웨</div><div class="chapter"><strong>04</strong>하나님의 마음</div></div><p class="caption">이번 체험에서는 1장만 열려 있어요. 요나서 완독은 4장까지입니다.</p><div class="hint">${s.read?'다음 분량: 요나서 2장 · 후속 버전에서 제공':'첫 목표는 한 장. 놓친 날이 있어도 기록은 사라지지 않아요.'}</div></section><section class="panel"><h3>최근 7일의 발걸음</h3><div class="week">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<span title="${k}" class="day ${s.days.includes(k)?'done':''}">${d.getDate()}</span>`}).join('')}</div><small>이 체험에서 읽은 날짜만 표시합니다.</small></section></div><div><section class="panel"><div class="row between"><h3>${s.quiz?'나의 첫 인물 카드':'오늘 기다리는 카드'}</h3><span class="tag">확정 보상</span></div>${card(!s.quiz,s.gold)}<p class="caption">아밋대의 아들 · 선지자<br>관련 말씀: 요나서 1:1–3</p><button class="full" onclick="${s.quiz?"go('cards')":"reader('plan')"}">${s.quiz?'도감에서 자세히 보기':'읽고 복습하면 요나 획득'}</button></section><div class="hint">읽은 기록과 카드 보상은 따로예요.<br>복습은 본문을 다시 보며 풀어도 괜찮아요.</div></div></div>`}
function reader(m){mode=m;view.innerHTML=`<div class="reader"><div class="reader-head"><button class="link" onclick="go('${m==='plan'?'home':'bible'}')">${m==='plan'?'← 나의 1독':'자유 성경'}</button><div class="row between"><h1 style="margin:8px 0">요나서 1장</h1><span class="pill">${m==='plan'?'오늘의 1독':'자유 읽기'}</span></div><small>1–17절 · 직접 작성한 내용 요약 · 개역개정 본문 아님</small>${m==='free'?'<input id="search" aria-label="구절 검색" placeholder="이 장에서 검색 · 예: 다시스, 요나 1:3" oninput="filterVerses(this.value)">':''}</div><p class="hint">정식 서비스는 개역개정을 사용할 계획입니다. 이 화면은 읽기 흐름 검증용 요약이며, 본문을 대체하지 않습니다.</p><div id="verse-list" class="reader-body"></div><div id="verse-detail"></div><div class="actions">${m==='plan'?`<div class="row between"><small>17절까지 읽고 기록해 주세요.</small><button class="primary" onclick="markRead()">${s.read?'복습하기':'읽음 기록하고 복습'} →</button></div>`:'<small>구절을 누르면 북마크와 연결된 설교를 볼 수 있어요. 자유 읽기는 1독 진도를 변경하지 않습니다.</small>'}</div></div>`;filterVerses('')}
function filterVerses(q){let ref=q.match(/(?:요나(?:서)?\s*)?1:(\d+)$/);let items=verses.map((t,i)=>({t,n:i+1})).filter(v=>!q||(ref?v.n===+ref[1]:v.t.includes(q)));document.querySelector('#verse-list').innerHTML=items.length?items.map(v=>`<button class="verse ${s.bookmarks.includes(v.n)?'saved':''}" onclick="selectVerse(${v.n},this)"><span>${v.n}</span><span>${v.t}</span></button>`).join(''):'<p class="empty">이 장에서 일치하는 구절을 찾지 못했어요.</p>'}
function selectVerse(n,b){selection=n;document.querySelectorAll('.verse').forEach(e=>e.classList.remove('selected'));if(b)b.classList.add('selected');let matched=s.notes.filter(x=>n>=x.start&&n<=x.end||x.refs.split(',').some(r=>matches(r.trim(),n)));document.querySelector('#verse-detail').innerHTML=`<section class="panel"><div class="row between"><h3>요나서 1:${n}</h3><button onclick="bookmark()">${s.bookmarks.includes(n)?'★ 북마크 해제':'☆ 북마크'}</button></div><button onclick="noteForm()">이 구절로 설교 메모</button><h3 class="section-title">연결된 설교 ${matched.length}개</h3>${matched.length?matched.map(noteHTML).join(''):'<small>아직 연결된 설교가 없어요.</small>'}</section>`;document.querySelector('#verse-detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function matches(r,n){let m=r.match(/^요나(?:서)?\s*1:(\d+)(?:[-–](\d+))?$/);return m&&n>=+m[1]&&n<=+(m[2]||m[1])}function bookmark(){s.bookmarks=s.bookmarks.includes(selection)?s.bookmarks.filter(n=>n!==selection):[...s.bookmarks,selection];save();filterVerses(document.querySelector('#search')?.value||'');selectVerse(selection);toast('북마크를 변경했어요.')}
function markRead(){if(!s.read)s.read=true;if(!s.days.includes(today()))s.days.push(today());save();qIndex=0;quiz()}
const questions=[{q:'요나가 배를 타고 도망가려던 곳은?',a:['니느웨','다시스','예루살렘'],correct:1,ref:'1:3',why:'사명을 받은 곳은 니느웨, 도망가려던 목적지는 다시스예요.'},{q:'요나를 삼킨 것은 무엇인가요?',a:['큰 물고기','사자','독수리'],correct:0,ref:'1:17',why:'요나서에는 “큰 물고기”로 나와요. 고래로 특정하지 않아요.'}];function quiz(){if(s.quiz&&s.reviewDays.includes(today())){open(`<h2>오늘의 복습도 마쳤어요.</h2><p>본문은 언제든 다시 읽을 수 있어요. 복습 인장은 하루에 한 번 쌓입니다.</p><button class="primary" onclick="closeModal();go('cards')">도감 보기</button>`);return}let q=questions[qIndex];open(`<div class="tag">기억에 남기는 한 걸음 · ${qIndex+1}/2</div><h2 style="margin-top:16px">${q.q}</h2><p class="muted">읽음은 저장했어요. 오답 불이익은 없어요.</p><div class="choices">${q.a.map((a,i)=>`<button onclick="answer(${i})">${a}</button>`).join('')}</div><div id="feedback" role="status"></div><div class="row between"><button class="link" onclick="document.querySelector('#feedback').textContent='${verses[+q.ref.split(':')[1]-1]}'">요나서 ${q.ref} 요약 다시 보기</button><button class="link" onclick="closeModal();go('home')">복습은 나중에</button></div>`)}function answer(a){const q=questions[qIndex];if(a!==q.correct){document.querySelector('#feedback').innerHTML=`<p class="hint">다시 생각해 볼까요? ${q.why}</p>`;return}if(qIndex===0){qIndex=1;quiz();return}const first=!s.quiz;s.quiz=true;if(!s.reviewDays.includes(today()))s.reviewDays.push(today());save();open(`<div class="tag">${first?'NEW COLLECTION':'REVIEW COMPLETE'}</div><h2>${first?'첫 번째 동료, 요나!':'말씀을 한 번 더 기억했어요.'}</h2>${card(false,s.gold)}<p>${first?'요나 카드와 30 XP를 받았어요.':'중복 카드 대신 복습 인장이 쌓였어요.'}</p><p class="muted">${s.reviewDays.length} / 3일 복습 · 3일에 걸쳐 복습하면 황금 테두리로 꾸밀 수 있어요.</p><button class="primary full" onclick="closeModal();go('cards')">내 도감에 담기</button>`)}
function cards(){view.innerHTML=`<div class="tag">THE COLLECTION</div><h1>읽은 이야기가, 나의 도감으로.</h1><p class="muted">인물의 가치를 등급으로 나누지 않아요. 판본과 테두리로 여정을 기록합니다.</p><div class="collection"><section class="panel">${card(!s.quiz,s.gold)}<button class="full" onclick="cardDetail()">요나 카드 살펴보기</button></section><section class="panel"><div class="tag">CARD MASTERY</div><h2>다시 읽는 즐거움</h2><p>서로 다른 3일에 복습하고<br>요나 카드에 황금 테두리를 더해요.</p><div class="progress"><span style="width:${Math.min(100,s.reviewDays.length/3*100)}%"></span></div><p>${s.reviewDays.length} / 3일 복습</p><button class="primary full" ${!s.quiz||s.gold||s.reviewDays.length<3?'disabled':''} onclick="s.gold=true;save();cards();toast('황금 테두리를 적용했어요.')">${s.gold?'황금 테두리 적용됨':'황금 테두리로 성장'}</button><p class="caption">읽기 횟수는 제한하지 않아요. 같은 날 반복해도 보상은 늘어나지 않아요.</p><button class="full" onclick="reader('plan')">본문으로 돌아가기</button></section><section class="panel"><div class="tag">NEXT CHAPTER</div><h2>여정은 계속됩니다.</h2><p>요나서 4장 완독 기념판</p><div class="empty" style="font-size:48px">✧</div><p class="caption">후속 버전에서 제공<br>이번 체험의 수집 목표는 요나 1장입니다.</p></section></div>`}function cardDetail(){open(`<h2>요나 · 아밋대의 아들</h2><p>니느웨로 가라는 사명을 받았지만 다시스로 향한 선지자. 첫 장에서는 도망과 폭풍, 선원들의 반응, 큰 물고기의 등장을 만납니다.</p><p>근거: 요나서 1:1–3, 1:9, 1:17</p><p class="hint">해금 조건: 요나서 1장 읽음 기록 + 복습 2문항 완료<br>현재: ${s.quiz?'보유 중':'미획득'} · 전투 능력치는 아직 없습니다.</p><button class="primary" onclick="closeModal();reader('free')">관련 말씀 읽기</button> <button onclick="closeModal()">닫기</button>`)}
function noteForm(id){const x=s.notes.find(n=>n.id===id)||{date:today(),title:'',preacher:'',start:selection,end:selection,refs:'',body:''};open(`<h2>${id?'설교 메모 수정':'설교를 기록해요'}</h2><form id="note-form"><label>설교 제목<input name="title" required maxlength="100" value="${esc(x.title)}" placeholder="예: 도망 중에도 찾아오시는 하나님"></label><div class="row"><label>날짜<input name="date" type="date" required value="${x.date}"></label><label>설교자<input name="preacher" value="${esc(x.preacher)}" maxlength="80" placeholder="선택"></label></div><label>본문 범위 · 요나서 1장<div class="row"><select name="start" aria-label="시작 절">${options(x.start)}</select><select name="end" aria-label="끝 절">${options(x.end)}</select></div></label><label>관련 말씀 · 쉼표로 구분<input name="refs" value="${esc(x.refs)}" placeholder="요나 1:17, 시편 139:9-10"></label><label>메모<textarea name="body" required maxlength="20000" placeholder="설교 내용과 나의 생각을 남겨 보세요.">${esc(x.body)}</textarea></label><p id="form-error" role="alert"></p><div class="row"><button type="submit" class="primary">메모 저장</button><button type="button" onclick="closeModal()">취소</button></div></form>`);document.querySelector('#note-form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.start=+f.start;f.end=+f.end;if(f.start>f.end||!f.title.trim()||!f.body.trim()){document.querySelector('#form-error').textContent='제목·메모와 시작/끝 절 범위를 확인해 주세요.';return}f.id=id||crypto.randomUUID();s.notes=id?s.notes.map(n=>n.id===id?f:n):[f,...s.notes];save();closeModal();go('notes');toast('설교와 말씀의 연결을 저장했어요.')}}function options(n){return Array.from({length:17},(_,i)=>`<option ${i+1===n?'selected':''}>${i+1}</option>`).join('')}
function noteHTML(n){return `<article class="note"><small>${esc(n.date)} ${esc(n.preacher)}</small><h3>${esc(n.title)}</h3><div class="note-links"><button onclick="jump(${n.start})">요나 1:${n.start}–${n.end}</button>${n.refs.split(',').filter(r=>r.trim()).map(r=>`<span class="pill">${esc(r.trim())}</span>`).join('')}</div><p>${esc(n.body)}</p><button class="link" onclick="noteForm('${n.id}')">수정</button> <button class="link" onclick="deleteNote('${n.id}')">삭제</button></article>`}function jump(n){go('bible');selectVerse(n)}function deleteNote(id){open(`<h2>이 설교 메모를 삭제할까요?</h2><p>연결된 말씀 기록도 함께 지워집니다.</p><button class="primary" onclick="s.notes=s.notes.filter(n=>n.id!=='${id}');save();closeModal();go('notes')">삭제</button> <button onclick="closeModal()">취소</button>`)}function notes(){view.innerHTML=`<div class="row between"><div><div class="tag">MY SCRIPTURE JOURNAL</div><h1>말씀 곁에 쌓인 이야기.</h1></div><button class="primary" onclick="noteForm()">＋ 설교 메모</button></div><div class="grid"><section class="panel"><h3>설교 기록 <small>${s.notes.length}</small></h3><input id="note-search" placeholder="제목, 메모, 관련 말씀 검색" aria-label="설교 검색" oninput="renderNotes()"><label style="margin-top:10px">설교 날짜<input id="note-date" type="date" onchange="renderNotes()"></label><button class="link" onclick="document.querySelector('#note-date').value='';renderNotes()">날짜 필터 지우기</button><div id="notes-list"></div></section><aside><section class="panel"><h3>자주 연결한 말씀</h3><div>${Array.from({length:17},(_,i)=>({n:i+1,count:s.notes.filter(x=>i+1>=x.start&&i+1<=x.end||x.refs.split(',').some(r=>matches(r.trim(),i+1))).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count).slice(0,5).map(x=>`<p><button class="link" onclick="jump(${x.n})">요나서 1:${x.n}</button>　${x.count}개 설교</p>`).join('')||'<p class="muted">설교를 기록하면 자주 인용한 구절이 모여요.</p>'}</div><small>현재 요나서 1장 범위에서 집계합니다.</small></section><section class="panel"><h3>나의 북마크</h3>${s.bookmarks.map(n=>`<p><button class="link" onclick="jump(${n})">★ 요나서 1:${n}</button></p>`).join('')||'<small>자유 읽기에서 구절을 저장해 보세요.</small>'}</section></aside></div><p class="caption">다른 장의 관련 말씀은 참조 문구로 저장됩니다. 본문 이동과 역추적은 이번 체험의 요나서 1장만 지원합니다.</p>`;renderNotes()}function renderNotes(){let q=document.querySelector('#note-search').value,d=document.querySelector('#note-date').value;const filtered=s.notes.filter(n=>(!d||n.date===d)&&[n.title,n.body,n.refs,n.preacher,`요나 1:${n.start}-${n.end}`].join(' ').includes(q));document.querySelector('#notes-list').innerHTML=filtered.length?filtered.sort((a,b)=>b.date.localeCompare(a.date)).map(noteHTML).join(''):'<div class="empty">아직 표시할 설교가 없어요.<br>한 구절에 여러 설교를 연결할 수 있어요.</div>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.querySelector('#reset').onclick=()=>open('<h2>체험 기록을 초기화할까요?</h2><p>이 브라우저의 읽기, 카드, 북마크, 설교 메모가 모두 지워집니다.</p><button class="primary" onclick="s=fresh();save();closeModal();go(\'home\')">초기화</button> <button onclick="closeModal()">취소</button>');go('home');
</script></body></html>
